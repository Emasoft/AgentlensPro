name: Publish Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least privilege: read the repo, push the image to GHCR. Nothing else.
permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    # TRDD-6MG5N1ZF: the Rust release build of alcore runs inside the image build.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes to git; registry auth is docker/login-action's own token flow.
          persist-credentials: false

      # Third-party actions pinned to full commit SHAs (tag-rewrite protection).
      - name: Set up QEMU (for cross-platform builds)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # GHCR only. The fork inherited a Docker Hub push to `agentlens/agentlens` —
      # that is the UPSTREAM project's Docker Hub repository, and this repo carries
      # no DOCKERHUB_* secrets, so the login step could only fail (and pushing there
      # would be wrong even with credentials). GHCR authenticates with the ephemeral
      # GITHUB_TOKEN and needs no stored secret.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # metadata-action lowercases the repository name for the registry.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # TRDD-6MG5N1ZF: the image compiles alcore (bundled DuckDB, thin LTO); under QEMU the arm64 leg would compile emulated and overrun the job. amd64 only until TRDD-6J96UCTJ adds a native arm64 runner.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SLSA build provenance: buildx attaches an in-toto attestation to the
          # image manifest so consumers can verify what built the image and from
          # which commit (janitor audit — release-path provenance). mode=max
          # records the full build steps + materials (TRDD-OMMPS5TF); sbom adds
          # an SPDX inventory attestation so `docker buildx imagetools inspect`
          # answers "what is inside this image", not just "who built it".
          provenance: mode=max
          sbom: true
