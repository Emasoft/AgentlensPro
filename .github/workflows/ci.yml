name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # corepack downloads the pnpm version pinned by package.json "packageManager";
  # without this the download confirmation prompt can hang a non-TTY CI step.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # pnpm via corepack — the version comes from package.json "packageManager"
      # (single source of truth; no third-party action needed). MUST run before
      # setup-node: its `cache: pnpm` step invokes `pnpm store path`, so the
      # corepack shim has to already be on PATH.
      - name: Enable corepack (pnpm)
        run: corepack enable

      # Dependencies are ALWAYS installed under Node 22: the corepack-pinned
      # pnpm requires Node >= 22.13 (it imports node:sqlite — run 29105351614
      # died at setup on the Node 20 leg). pnpm is dev tooling only; the
      # matrix node below is what actually builds and runs the tests.
      - name: Setup Node.js 22 (for pnpm install)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Switch the active runtime to the matrix node. Every step after this
      # uses npx (not `pnpm run`) so nothing re-invokes pnpm under a node it
      # cannot run on — mirroring the local workflow (deps installed under the
      # default node, mocha executed under Node 20 via PATH).
      - name: Setup Node.js ${{ matrix.node-version }} (test runtime)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Type check (both tsconfigs)
        run: npx tsc --noEmit && npx tsc --noEmit -p media/tsconfig.json

      - name: Lint
        run: npx eslint src media/src

      # Anti-mirror guard: fails if media/src re-declares a symbol src/shared exports.
      # The webview must import the shared source of truth, never keep a hand-synced copy.
      - name: Check no mirrors
        run: node scripts/check-no-mirrors.js

      # Recall-invariant guard for the PROJECT wikimem: a `[^N]` lesson without `keywords:`
      # is on disk and unreachable, because keywords is the only field recall ranks on.
      - name: Check memory lessons are recallable
        run: node scripts/check-memory-lessons.js

      # Identity guard: no personal email or home path in anything tracked or shipped, and a
      # STRICTER bar inside skills/ — a skill is installed on other people's machines, so a real
      # session id or account uuid there is one machine's noise shipped to everyone. Caught 31
      # occurrences the day it was written, including three real addresses in the published skill.
      - name: Check no personal identities
        run: node scripts/check-no-identities.js

      # TRDD-EAK9R8IY: ci.yml enumerates checks individually rather than running `pnpm run
      # compile`, so a guard wired only into compile/package silently never runs on PRs — this
      # one was, until a review caught it. Keep this list and package.json's compile script in
      # sync when adding guards.
      - name: Check platform-package version pins (lockstep with main version)
        run: node scripts/check-platform-package-pins.js

      # Bundles MUST be built BEFORE the unit suite: the server integration
      # tests boot the bundled standalone/server.js, which is an esbuild output
      # (only the .ts sources are tracked). Running mocha first fails with
      # "Cannot find module .../standalone/server.js" (run 29104608764).
      - name: Build bundles
        run: node esbuild.js

      - name: Compile tests
        run: npx tsc -p tsconfig.test.json

      # Full unit suite under the matrix node — mocha directly (out/test via .mocharc.cjs).
      # The P9 browser smoke suite stays PENDING here (gated on AGENTLENSPRO_BROWSER_TESTS=1)
      # so this matrix is untouched; the dedicated browser-smoke job below runs it.
      - name: Unit tests
        run: npx mocha

  # ── P9 dashboard browser smoke suite ─────────────────────────────────────────
  # Dedicated job (separate from the matrix above) so a browser/env flake never
  # blocks the core build-and-test signal. Boots the real standalone server on
  # ephemeral ports with a temp data dir, then drives the served dashboard with
  # puppeteer-core against a system Chrome/Chromium.
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Enable corepack (pnpm)
        run: corepack enable

      # Node 22 for BOTH install and test runtime here: the corepack-pinned pnpm
      # needs >=22.13, and the unit matrix already proves the suite on Node 20.
      - name: Setup Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # puppeteer-core ships no browser. ubuntu-latest images preinstall Google
      # Chrome; fall back to installing chromium when the image ever drops it.
      - name: Resolve Chrome/Chromium (install chromium if missing)
        run: |
          BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$BIN" ]; then
            sudo apt-get update
            sudo apt-get install -y chromium-browser
            BIN="$(command -v chromium-browser)"
          fi
          echo "Resolved browser: $BIN"
          echo "CHROME_PATH=$BIN" >> "$GITHUB_ENV"

      # The suite boots the BUILT standalone/server.js — bundles must exist first.
      - name: Build bundles
        run: node esbuild.js

      - name: Compile tests
        run: npx tsc -p tsconfig.test.json

      # --no-config: .mocharc.cjs would union its spec glob (the whole unit suite)
      # with the positional file; the isolated invocation needs only this suite.
      - name: Browser smoke suite
        env:
          AGENTLENSPRO_BROWSER_TESTS: '1'
        run: npx mocha --no-config --ui tdd out/test/test/browser/dashboardSmoke.test.js

  # ── Rust core (TRDD-DMWOBWFH) ────────────────────────────────────────────────
  # Until this job existed, rust-core/ was NEVER built or tested by CI: publish.yml
  # compiled it only on a release tag, so a broken crate reached `main` green and
  # surfaced at publish time. The workspace is the gate: the "-p agentlens-store
  # only" habit is a LOCAL cost optimisation, never a correctness limit — on macOS
  # each freshly built test binary stalls ~70s before its harness starts (measured:
  # 0% CPU, no open files; the same binary run standalone finishes in 0.04s), and
  # with ~100 binaries that stall IS the local runtime. Linux runners don't pay it.
  #
  # Caching is safe HERE and deliberately absent from publish.yml: a poisoned cache
  # entry in a release path would be baked into a published artifact, whereas CI
  # only reports a signal (zizmor cache-poisoning). Swatinem/rust-cache keys on the
  # lockfile + rustc version and never caches the workspace crates themselves, so a
  # source change still rebuilds — it is the statically-linked duckdb dependency
  # that the cache is actually buying back.
  rust:
    runs-on: ubuntu-latest
    # Cold (cache miss) the duckdb static link dominates; warm runs are minutes.
    timeout-minutes: 40
    # `cargo test` needs no network once vendored deps are fetched, and nothing here
    # reads event data — this job takes no untrusted input.

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Same pin as publish.yml's build-platform-packages leg — one toolchain
      # across CI and release, so a crate that compiles here compiles there.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (stable toolchain)
        with:
          toolchain: stable
          components: clippy

      # `workspaces:` takes `$workspace -> $target`, and the bare left side IS legal —
      # verified in the action's own src/config.ts at this pinned SHA, not from docs:
      #   let [root, target = "target"] = workspace.split("->").map(s => s.trim())
      # so `rust-core` resolves to root=rust-core, target=rust-core/target. Worth
      # pinning here because a `workspaces:` value the action cannot resolve caches
      # NOTHING and still reports success — a green step doing no work.
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust-core

      # No `cargo fmt --check` step: the tree is 3564 hunks across 200 files away
      # from rustfmt's output, so adding the gate today means a mechanical reformat
      # that would bury every real Rust diff for the rest of the port. Add it as the
      # FIRST commit of the cutover (TRDD-DMWOBWFH), not as a side effect of wiring CI.
      - name: Clippy (warnings are errors)
        run: cargo clippy --manifest-path rust-core/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --manifest-path rust-core/Cargo.toml --workspace
