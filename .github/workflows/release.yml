name: Release

on:
  push:
    tags:
      - 'v*'

# Least privilege: read by default; only the job that creates a Release gets write.
permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write  # softprops/action-gh-release creates the GitHub Release

    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json "packageManager" (no `version:` input).
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run check-types

      - name: Unit tests
        run: pnpm run test:unit

      - name: Install vsce
        run: pnpm add -g @vscode/vsce

      - name: Package VSIX
        run: vsce package --no-dependencies

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-package
          path: '*.vsix'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: '*.vsix'
          generate_release_notes: true

  publish-vsce:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix-package

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: |
          set +e
          vsce publish --packagePath *.vsix > /tmp/vsce_out.txt 2>&1
          EXIT=$?
          set -e
          cat /tmp/vsce_out.txt
          if [ $EXIT -ne 0 ] && grep -q "already exists" /tmp/vsce_out.txt; then
            echo "Version already published to VS Code Marketplace — skipping"
            exit 0
          fi
          exit $EXIT

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: |
          npm install -g ovsx
          ovsx publish *.vsix

  publish-npm:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write  # Required for npm Trusted Publishing (OIDC — no stored secret needed)
      contents: read   # actions/checkout + npm --provenance need repo read

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          # registry-url is required so setup-node writes the registry endpoint to
          # .npmrc. Without it, npm throws ENEEDAUTH before attempting OIDC.
          # NODE_AUTH_TOKEN must NOT be set in the publish step so npm falls back
          # to OIDC Trusted Publishing instead of classic token auth.
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC Trusted Publishing
        # Node 20 ships with npm 10.x. OIDC Trusted Publishing requires npm 11.x+.
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to npm
        # Trusted Publishing: npm exchanges the GitHub Actions OIDC token for a
        # short-lived publish credential — no NPM_TOKEN secret required.
        # NODE_AUTH_TOKEN must not be set; npm falls back to OIDC when it is absent.
        run: npm publish --access public --provenance
