name: Release

on:
  push:
    tags:
      - 'v*'
  # Re-run the npm publish WITHOUT re-tagging (e.g. after configuring the
  # trusted publisher on npmjs for a first release whose tag already fired).
  # Mirrors the proven Emasoft/SVG-BBOX publish workflow.
  workflow_dispatch:

# Least privilege: read by default; each job asks only for what it needs.
permissions:
  contents: read

env:
  # corepack downloads the pnpm version pinned by package.json "packageManager";
  # without this the download confirmation prompt can hang a non-TTY CI step.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write       # softprops/action-gh-release creates the Release + uploads the tarball
      id-token: write       # sign the build-provenance attestation (Sigstore keyless)
      attestations: write   # store the in-toto attestation on the repository

    steps:
      # Every action SHA-pinned — including first-party (TRDD-OMMPS5TF): this workflow signs
      # attestations and publishes, so a rewritten tag anywhere in it is a supply-chain hole.
      # persist-credentials off: nothing here pushes; the default leaves the GITHUB_TOKEN in
      # .git/config where any later step (or a compromised dep's postinstall) can read it.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # pnpm via corepack — the version comes from package.json "packageManager"
      # (single source of truth, same pattern as ci.yml; no third-party action).
      # Node 22 is REQUIRED here: the corepack-pinned pnpm imports node:sqlite,
      # which needs Node >= 22.13 — the inherited Node 20 pin could never install.
      - name: Enable corepack (pnpm)
        run: corepack enable

      # NO dependency cache in the release path (zizmor cache-poisoning): a poisoned pnpm
      # store restored here would flow straight into the signed release artifacts. CI keeps
      # its cache; releases install cold — determinism over the ~1min saved.
      # (zizmor ignore: its model says setup-node "enables caching by default" — it does not;
      # the `cache:` input defaults OFF and is deliberately absent here.)
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0  # zizmor: ignore[cache-poisoning]
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run check-types

      # A publish is the one irreversible step: `skills/` ships to every installer, so an identity
      # that reaches the tarball cannot be recalled. This runs BEFORE the bundles are built so the
      # job stops at the cheapest point.
      - name: Check no personal identities
        run: pnpm run check-identities

      # Bundles MUST be built BEFORE the unit suite: the server integration tests
      # boot the bundled standalone/server.js (an esbuild output — only the .ts
      # sources are tracked). --production so the tests run against exactly the
      # bytes that ship in the tarball below.
      - name: Build production bundles
        run: node esbuild.js --production

      - name: Unit tests
        run: pnpm run test:unit

      # The npm tarball IS the release artifact for this npm-first distribution:
      # attach it to the GitHub Release with a SLSA build-provenance attestation
      # (janitor audit — release-path provenance). `npm publish --provenance`
      # below covers the registry copy; this covers the GitHub Release copy.
      - name: Pack npm tarball
        run: npm pack

      # Release-asset integrity (TRDD-OMMPS5TF, janitor provenance-audit): consumers verifying a
      # downloaded tarball need a checksum file NEXT TO the asset — the in-toto attestation covers
      # provenance (who built it), the checksum covers transport integrity (what you downloaded).
      - name: Generate release checksums
        run: sha256sum agentlenspro-*.tgz > SHA256SUMS.txt

      # SPDX SBOM over the packed project (TRDD-OMMPS5TF): the release ships a dependency
      # inventory so consumers can audit/diff what is inside. Attached explicitly below —
      # the action's own uploaders are disabled so the Release step stays the ONE attach point.
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: agentlenspro-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # The Release steps only make sense on a tag push — a workflow_dispatch
      # run (used to retry the npm publish) has no tag to attach a Release to.
      - name: Attest build provenance (in-toto / SLSA)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: 'agentlenspro-*.tgz'

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          generate_release_notes: true
          files: |
            agentlenspro-*.tgz
            SHA256SUMS.txt
            agentlenspro-sbom.spdx.json

  # npm Trusted Publishing (OIDC) — this job MIRRORS the PROVEN Emasoft/SVG-BBOX
  # publish workflow (the user's reference config; npm's own docs are sparse):
  #   * Node 24 via setup-node — its bundled npm (>= 11.5.1) does the OIDC
  #     exchange natively; no npm upgrade step needed.
  #   * NO `registry-url:` on setup-node — that input writes an
  #     `_authToken=${NODE_AUTH_TOKEN}` line into .npmrc, which pushes npm down
  #     the classic-token path instead of OIDC. The proven config omits it.
  #   * NO `environment:` — the npmjs trusted-publisher entry for svg-bbox is
  #     configured without one; an environment claim mismatch makes the registry
  #     reject the exchange (surfacing as E404 on PUT).
  #   * Plain `npm publish --access public` — no token anywhere; provenance is
  #     attached automatically under trusted publishing.
  # Registry-side prerequisite (one-time, web UI, owner-only): npmjs trusted
  # publisher for package `agentlenspro` → GitHub Actions, repo
  # Emasoft/AgentlensPro, workflow `publish.yml`, no environment. npm authorizes
  # the workflow FILENAME — this file was renamed release.yml → publish.yml to
  # match the registered trusted-publisher entry (and the SVG-BBOX convention);
  # renaming either side alone breaks the OIDC claim match.
  publish-npm:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Tag pushes publish; workflow_dispatch re-runs a publish without re-tagging
    # (first-release bootstrap: the v1.0.0 tag fired before the npmjs trusted
    # publisher existed).
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write  # Required for npm Trusted Publishing (OIDC — no stored secret)
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Enable corepack (pnpm)
        run: corepack enable

      # No cache here either (see the package job) — this job runs `npm publish`, the single
      # most supply-chain-sensitive step in the repo. (zizmor ignore: caching is OFF — the
      # `cache:` input defaults off and is deliberately absent; see the package job note.)
      - name: Setup Node.js 24 (bundled npm has OIDC support)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0  # zizmor: ignore[cache-poisoning]
        with:
          node-version: 24

      - name: Verify toolchain versions
        # Ported from the proven SVG-BBOX workflow: fail fast if the runner image
        # ever hands us a toolchain that cannot do OIDC trusted publishing.
        run: |
          NODE_VER=$(node --version | sed 's/v//')
          NPM_VER=$(npm --version)
          echo "Node.js: $NODE_VER — npm: $NPM_VER"
          if [[ ! "$NODE_VER" =~ ^24\. ]]; then
            echo "::error::Expected Node.js 24.x, got $NODE_VER"
            exit 1
          fi
          NPM_MAJOR=$(echo "$NPM_VER" | cut -d. -f1)
          NPM_MINOR=$(echo "$NPM_VER" | cut -d. -f2)
          if [ "$NPM_MAJOR" -lt 11 ] || { [ "$NPM_MAJOR" -eq 11 ] && [ "$NPM_MINOR" -lt 5 ]; }; then
            echo "::error::npm >= 11.5.1 required for OIDC trusted publishing (got $NPM_VER)"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to npm (OIDC trusted publishing)
        # prepublishOnly runs `pnpm run package` (type-check + lint + production
        # bundle), so the published tarball always carries freshly built bundles.
        run: npm publish --access public
