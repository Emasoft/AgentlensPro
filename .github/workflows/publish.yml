name: Release

on:
  push:
    tags:
      - 'v*'
  # Re-run the npm publish WITHOUT re-tagging (e.g. after configuring the
  # trusted publisher on npmjs for a first release whose tag already fired).
  # Mirrors the proven Emasoft/SVG-BBOX publish workflow.
  workflow_dispatch:

# Least privilege: read by default; each job asks only for what it needs.
permissions:
  contents: read

env:
  # corepack downloads the pnpm version pinned by package.json "packageManager";
  # without this the download confirmation prompt can hang a non-TTY CI step.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  package:
    # Waits for every native runner's binaries — the tarball packed below CONTAINS them, so a
    # missing leg must block the release rather than ship a package that silently falls back to
    # the TS server on that platform.
    needs: [build-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write       # softprops/action-gh-release creates the Release + uploads the tarball
      id-token: write       # sign the build-provenance attestation (Sigstore keyless)
      attestations: write   # store the in-toto attestation on the repository

    steps:
      # Every action SHA-pinned — including first-party (TRDD-OMMPS5TF): this workflow signs
      # attestations and publishes, so a rewritten tag anywhere in it is a supply-chain hole.
      # persist-credentials off: nothing here pushes; the default leaves the GITHUB_TOKEN in
      # .git/config where any later step (or a compromised dep's postinstall) can read it.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # pnpm via corepack — the version comes from package.json "packageManager"
      # (single source of truth, same pattern as ci.yml; no third-party action).
      # Node 22 is REQUIRED here: the corepack-pinned pnpm imports node:sqlite,
      # which needs Node >= 22.13 — the inherited Node 20 pin could never install.
      - name: Enable corepack (pnpm)
        run: corepack enable

      # NO dependency cache in the release path (zizmor cache-poisoning): a poisoned pnpm
      # store restored here would flow straight into the signed release artifacts. CI keeps
      # its cache; releases install cold — determinism over the ~1min saved.
      # (zizmor ignore: its model says setup-node "enables caching by default" — it does not;
      # the `cache:` input defaults OFF and is deliberately absent here.)
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0  # zizmor: ignore[cache-poisoning]
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run check-types

      # A publish is the one irreversible step: `skills/` ships to every installer, so an identity
      # that reaches the tarball cannot be recalled. This runs BEFORE the bundles are built so the
      # job stops at the cheapest point.
      - name: Check no personal identities
        run: pnpm run check-identities

      # Bundles MUST be built BEFORE the unit suite: the server integration tests
      # boot the bundled standalone/server.js (an esbuild output — only the .ts
      # sources are tracked). --production so the tests run against exactly the
      # bytes that ship in the tarball below.
      - name: Build production bundles
        run: node esbuild.js --production

      - name: Unit tests
        run: pnpm run test:unit

      # The npm tarball IS the release artifact for this npm-first distribution:
      # attach it to the GitHub Release with a SLSA build-provenance attestation
      # (janitor audit — release-path provenance). `npm publish --provenance`
      # below covers the registry copy; this covers the GitHub Release copy.
      # The Rust binaries built by build-binaries, unpacked back into the layout
      # src/rustBinResolve.ts expects: bin-native/<platform>-<arch>/{alcore,alstore,alscan,allogscan}.
      - name: Download every platform's binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: bin-native
          pattern: bin-native-*
          merge-multiple: false

      # download-artifact restores `bin-native/bin-native-<suffix>/…` (the artifact NAME becomes
      # the directory), and the zip round-trip has dropped the executable bit. Flatten to the
      # resolver's layout and restore the mode — then PROVE both, because a wrong layout or a
      # lost x-bit produces a package that installs cleanly and fails only at spawn time.
      - name: Normalize layout and restore the executable bit
        run: |
          set -euo pipefail
          for d in bin-native/bin-native-*; do
            mv "$d" "bin-native/$(basename "$d" | sed 's/^bin-native-//')"
          done
          chmod +x bin-native/*/*
          node scripts/verify-bin-native.js bin-native

      - name: Pack npm tarball
        run: npm pack

      # npm's tar writer is what actually decides the mode inside the tarball, so checking the
      # working tree above is not enough — assert on the ARTIFACT. A binary that ships 0644
      # installs without error and fails at spawn on the user's machine.
      - name: Verify the binaries are executable INSIDE the tarball
        run: |
          set -euo pipefail
          tgz=$(ls agentlenspro-*.tgz)
          tar -tvzf "$tgz" | grep 'package/bin-native/' > /tmp/binlist.txt
          echo "--- bin-native entries in $tgz ---"; cat /tmp/binlist.txt
          count=$(grep -c '^-rwxr-xr-x' /tmp/binlist.txt || true)
          total=$(grep -cv '^d' /tmp/binlist.txt || true)
          if [ "$count" -ne 16 ] || [ "$total" -ne 16 ]; then
            echo "::error::expected 16 executable binaries in the tarball, found $count executable of $total files"
            exit 1
          fi
          echo "tarball OK: 16/16 binaries present and mode 755"

      # THE tarball the registry gets — handed to publish-npm rather than re-packed there.
      # v2.30.0 shipped 23 files and 0 binaries because publish-npm packed its own copy from a
      # clean checkout: every guard above passed, on an artifact nobody ever installed. A check
      # that measures a different artifact than the one you ship is not a check.
      - name: Upload the verified tarball for publish-npm
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball
          path: agentlenspro-*.tgz
          if-no-files-found: error
          retention-days: 1

      # Release-asset integrity (TRDD-OMMPS5TF, janitor provenance-audit): consumers verifying a
      # downloaded tarball need a checksum file NEXT TO the asset — the in-toto attestation covers
      # provenance (who built it), the checksum covers transport integrity (what you downloaded).
      - name: Generate release checksums
        run: sha256sum agentlenspro-*.tgz > SHA256SUMS.txt

      # SPDX SBOM over the packed project (TRDD-OMMPS5TF): the release ships a dependency
      # inventory so consumers can audit/diff what is inside. Attached explicitly below —
      # the action's own uploaders are disabled so the Release step stays the ONE attach point.
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: agentlenspro-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # The Release steps only make sense on a tag push — a workflow_dispatch
      # run (used to retry the npm publish) has no tag to attach a Release to.
      - name: Attest build provenance (in-toto / SLSA)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: 'agentlenspro-*.tgz'

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          generate_release_notes: true
          files: |
            agentlenspro-*.tgz
            SHA256SUMS.txt
            agentlenspro-sbom.spdx.json

  # npm Trusted Publishing (OIDC) — this job MIRRORS the PROVEN Emasoft/SVG-BBOX
  # publish workflow (the user's reference config; npm's own docs are sparse):
  #   * Node 24 via setup-node — its bundled npm (>= 11.5.1) does the OIDC
  #     exchange natively; no npm upgrade step needed.
  #   * NO `registry-url:` on setup-node — that input writes an
  #     `_authToken=${NODE_AUTH_TOKEN}` line into .npmrc, which pushes npm down
  #     the classic-token path instead of OIDC. The proven config omits it.
  #   * NO `environment:` — the npmjs trusted-publisher entry for svg-bbox is
  #     configured without one; an environment claim mismatch makes the registry
  #     reject the exchange (surfacing as E404 on PUT).
  #   * Plain `npm publish --access public` — no token anywhere; provenance is
  #     attached automatically under trusted publishing.
  # Registry-side prerequisite (one-time, web UI, owner-only): npmjs trusted
  # publisher for package `agentlenspro` → GitHub Actions, repo
  # Emasoft/AgentlensPro, workflow `publish.yml`, no environment. npm authorizes
  # the workflow FILENAME — this file was renamed release.yml → publish.yml to
  # match the registered trusted-publisher entry (and the SVG-BBOX convention);
  # renaming either side alone breaks the OIDC claim match.
  # Per-platform Rust binary packages (TRDD-EAK9R8IY, NPT of DMWOBWFH box 3): `alcore` and its
  # sidecars (`alstore`, `alscan`, `allogscan`) are built and published as `agentlenspro-<target>`
  # optionalDependencies, one per native runner — no cross-compilation, matching the pattern
  # `@duckdb/node-bindings` already uses in this dependency tree.
  #
  # win32-x64 is deliberately absent: rust-core/crates/agentlens-core/src/pid_lock.rs calls
  # `libc::kill`/`libc::EPERM` with no `#[cfg(unix)]` guard, so the crate does not build for
  # windows-msvc as written — see src/rustBinResolve.ts. Add a windows leg only after that is
  # fixed and verified, not speculatively.
  #
  # ONE PACKAGE, EVERY PLATFORM (owner ruling 2026-08-28). This job BUILDS the Rust binaries on
  # four native runners and uploads them as workflow artifacts; the `package` job downloads all
  # four into `bin-native/<platform>-<arch>/` and packs them INTO the single `agentlenspro`
  # tarball. It publishes nothing and creates no package name.
  #
  # It replaces a design that published four separate `agentlenspro-<target>` optionalDependency
  # packages (the esbuild/swc pattern). That design could not ship at all: npm's OIDC
  # trusted-publishing exchange only works against a name that ALREADY EXISTS on the registry, so
  # every leg 404'd — and because publish-npm waited on them, the MAIN package never published
  # either. Measured 2026-08-28: all four `npm view agentlenspro-<target>` → 404 while the registry
  # sat a release behind at 2.29.0. Bootstrapping four new names needs an interactive local 2FA
  # publish per name, which is exactly what the owner ruled out.
  #
  # The cost is known and accepted, not discovered later: gzip -9 gives alcore 52.6→17.0 MB and
  # alstore 39.9→11.8 MB, so four targets are ~121.5 MB downloaded / ~384 MB unpacked per install,
  # versus ~30 MB / ~96 MB if only the matching platform were fetched. `strip -S` was measured to
  # save 0 bytes — the statically linked DuckDB is the size and it does not compress away.
  build-binaries:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners only — no cross-compiling a statically-linked DuckDB (17k+ symbols).
          - suffix: darwin-arm64
            runner: macos-14
          - suffix: darwin-x64
            runner: macos-15-intel
          - suffix: linux-x64
            runner: ubuntu-latest
          - suffix: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read    # this job only builds and uploads an artifact — it publishes nothing,
                        # so it needs neither id-token nor write anywhere.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (stable toolchain)
        with:
          toolchain: stable

      - name: Build alcore/alstore/alscan/allogscan (release)
        run: cargo build --release --manifest-path rust-core/Cargo.toml

      # No Node/pnpm on this runner: it builds Rust and uploads bytes. Nothing here runs npm.
      #
      # matrix.suffix is a repo-controlled literal from the matrix above, never event input.
      - name: Stage bin-native/${{ matrix.suffix }}
        run: |
          set -euo pipefail
          dest="bin-native/${{ matrix.suffix }}"
          mkdir -p "$dest"
          for b in alcore alstore alscan allogscan; do
            cp "rust-core/target/release/$b" "$dest/$b"
            chmod +x "$dest/$b"
          done
          ls -l "$dest"

      # upload-artifact zips its input, and ZIP DOES NOT CARRY THE UNIX EXECUTABLE BIT — the
      # `package` job re-chmods after download for exactly this reason. Do not "simplify" that
      # away: without it the tarball ships binaries that resolve but cannot be spawned.
      - name: Upload bin-native/${{ matrix.suffix }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-native-${{ matrix.suffix }}
          path: bin-native/${{ matrix.suffix }}
          if-no-files-found: error
          retention-days: 1

  publish-npm:
    needs: [package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Tag pushes publish; workflow_dispatch re-runs a publish without re-tagging
    # (first-release bootstrap: the v1.0.0 tag fired before the npmjs trusted
    # publisher existed).
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write  # Required for npm Trusted Publishing (OIDC — no stored secret)
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Enable corepack (pnpm)
        run: corepack enable

      # No cache here either (see the package job) — this job runs `npm publish`, the single
      # most supply-chain-sensitive step in the repo. (zizmor ignore: caching is OFF — the
      # `cache:` input defaults off and is deliberately absent; see the package job note.)
      - name: Setup Node.js 24 (bundled npm has OIDC support)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0  # zizmor: ignore[cache-poisoning]
        with:
          node-version: 24

      - name: Verify toolchain versions
        # Ported from the proven SVG-BBOX workflow: fail fast if the runner image
        # ever hands us a toolchain that cannot do OIDC trusted publishing.
        run: |
          NODE_VER=$(node --version | sed 's/v//')
          NPM_VER=$(npm --version)
          echo "Node.js: $NODE_VER — npm: $NPM_VER"
          if [[ ! "$NODE_VER" =~ ^24\. ]]; then
            echo "::error::Expected Node.js 24.x, got $NODE_VER"
            exit 1
          fi
          NPM_MAJOR=$(echo "$NPM_VER" | cut -d. -f1)
          NPM_MINOR=$(echo "$NPM_VER" | cut -d. -f2)
          if [ "$NPM_MAJOR" -lt 11 ] || { [ "$NPM_MAJOR" -eq 11 ] && [ "$NPM_MINOR" -lt 5 ]; }; then
            echo "::error::npm >= 11.5.1 required for OIDC trusted publishing (got $NPM_VER)"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Publish THE tarball `package` built, attested and proved carries 16 executable binaries —
      # never a fresh `npm publish` from this checkout. That is what shipped v2.30.0 broken: this
      # job's clean tree has no bin-native/, so npm packed 23 files (3.75 MB) while the attested
      # GitHub Release asset was 144 MB. Same version, two different artifacts, and the one the
      # guards checked was not the one users installed.
      - name: Download the verified tarball from the package job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball

      # Re-assert here, on the exact bytes about to be published. The package job already checked
      # its copy; this proves the artifact survived the upload/download round-trip intact, and
      # costs one tar listing.
      - name: Verify the tarball still carries 16 executable binaries
        run: |
          set -euo pipefail
          tgz=$(ls agentlenspro-*.tgz)
          tar -tvzf "$tgz" | grep 'package/bin-native/' > /tmp/binlist.txt
          count=$(grep -c '^-rwxr-xr-x' /tmp/binlist.txt || true)
          total=$(grep -cv '^d' /tmp/binlist.txt || true)
          if [ "$count" -ne 16 ] || [ "$total" -ne 16 ]; then
            echo "::error::about to publish $tgz with $count executable of $total binaries, expected 16/16"
            exit 1
          fi
          echo "publishing $tgz — 16/16 binaries present and mode 755"

      - name: Publish to npm (OIDC trusted publishing)
        # Publishing a prebuilt tarball deliberately skips prepublishOnly (measured: `npm publish
        # --dry-run <tgz>` runs no lifecycle script). These bytes were already type-checked,
        # linted, bundled and verified by the package job; rebuilding here would produce DIFFERENT
        # bytes than the ones that were attested.
        #
        # Glob into an array and require exactly one match — a bare `ls agentlenspro-*.tgz` in a
        # step without `set -euo pipefail` would silently pick the first of several and publish
        # the wrong artifact.
        run: |
          set -euo pipefail
          shopt -s nullglob
          tgz=(agentlenspro-*.tgz)
          if [ "${#tgz[@]}" -ne 1 ]; then
            echo "::error::expected exactly 1 tarball to publish, found ${#tgz[@]}: ${tgz[*]-none}"
            exit 1
          fi
          npm publish "./${tgz[0]}" --access public

      # The only check that can actually catch a mis-published artifact: read it back from the
      # REGISTRY. Every guard above measures a local file; this measures what users will install.
      - name: Verify the REGISTRY tarball (not a local copy)
        run: |
          set -euo pipefail
          VER=$(node -p "require('./package.json').version")
          for i in 1 2 3 4 5; do
            npm view "agentlenspro@$VER" dist.tarball > /tmp/url.txt 2>/dev/null && break
            echo "registry not ready yet (attempt $i) — CDN propagation"; sleep 15
          done
          curl -fsSL "$(cat /tmp/url.txt)" -o /tmp/published.tgz
          n=$(tar -tzf /tmp/published.tgz | grep -c 'package/bin-native/.*/' || true)
          if [ "$n" -ne 16 ]; then
            echo "::error::published agentlenspro@$VER carries $n bin-native files, expected 16"
            exit 1
          fi
          echo "registry OK: agentlenspro@$VER carries 16 binaries"
