# agentlens-store — the bodies→DuckDB pipeline (TRDD-DMWOBWFH P3c).
[package]
name = "agentlens-store"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
duckdb = { version = "1.10506.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
# Kernel flock for the single-pass-per-store lock: auto-released on ANY process death
# (SIGKILL included), so an orphaned pass can never leave a stale lock behind.
fs2 = "0.4"
# raw_facts.rs: the Environment-block / model regexes moved here from agentlens-core
# (QSFYIHUO step 3, A2 hoist).
regex = "1"
# errno constants for pass.rs dir_sync_unsupported (TRDD-FINMFYDE); their values differ per platform.
libc = "0.2"

[[bin]]
name = "alstore"
path = "src/bin/alstore.rs"
