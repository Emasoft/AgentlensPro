# agentlens-core — the Rust server surface (TRDD-DMWOBWFH P4). P4c slice: the OTLP listener.
[package]
name = "agentlens-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
agentlens-ingest = { path = "../agentlens-ingest" }
agentlens-spanstore = { path = "../agentlens-spanstore" }
# P5b: the log reader is a LIBRARY call into the logscan crate (discovery + the per-source
# parsers), not an exec of allogscan — no NDJSON pipe, no second process, cards land directly.
agentlens-logscan = { path = "../agentlens-logscan" }
# Rows 14–15 (/api/bodies/export|purge): the export's store half and the purge's per-lump
# verify-before-delete gate query the DuckDB body store IN-PROCESS (the endpoints ARE store
# operations; the pass alone stays an alstore exec).
agentlens-store = { path = "../agentlens-store" }
# get_cache_event_log renders wall-clock LOCAL time and reports the IANA zone name
# (toLocaleTimeString('en-GB') + Intl.DateTimeFormat().resolvedOptions().timeZone). std has NO
# local-time support at all, and both crates were ALREADY in the workspace lock as transitive
# deps — this adds a direct edge to what is compiled either way, not new supply-chain surface.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
iana-time-zone = "0.1"
# The WAD volume lumps are gzip members (bodyArchive.ts zlib.gunzipSync).
flate2 = "1"
rayon = "1"
indexmap = "2"
# P5f: the log watcher (server.ts fs.watch recursive on every log root) — FSEvents/inotify/
# ReadDirectoryChanges behind one API; the 60s full sweep stays the correctness backstop.
notify = "8"
# preserve_order: wire objects keep TS insertion order (feature-unified workspace-wide anyway,
# but stated here so a lone build of this crate cannot silently lose it).
# float_roundtrip: serde_json's DEFAULT float parse is best-effort and read the codex fixture's
# 0.18181818181818182 one ulp off, failing an exact-parity test against a correct port — every
# TS-oracle comparison depends on fixture floats parsing to the exact double JS printed.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
regex = "1"
# The FAL fact store (forensics.db). Keep the VERSION identical to agentlens-logscan's declaration:
# cargo unifies the workspace onto one build of rusqlite, so a version mismatch would compile a
# bundled SQLite twice. The feature sets do NOT match and cannot — `functions` is required for the
# custom SQL fns (billable_weight / tier_classify / cost_usd / spike) that run_diagnostics_sql lets
# callers invoke, and logscan needs none of them. Features are additive under unification, so the
# single shared build simply carries `bundled` + `functions` and logscan links the same artifact.
# SQLite and not DuckDB because run_diagnostics_sql passes RAW caller SQL straight through —
# swapping the engine would change the dialect under queries this project does not own.
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
# forensicsIndex's frontmatter fingerprint is a sha1 — the hash is part of the on-wire value, so it
# is the algorithm that must match, not merely "some digest". RustCrypto, sharing the `digest` stack
# `sha2` already pulls into the workspace.
sha1 = "0.10"
# B4 (embed_auth): the signed viewer-role assertion is HMAC-SHA256 over a base64url payload —
# the ALGORITHM is the wire contract (AgentlensPro#4 §B4 pins a cross-repo test vector), not an
# implementation choice. Same RustCrypto `digest` stack sha1 already vendors, and `sha2` is
# already in the workspace lock via agentlens-store, so this adds a direct edge to what is
# compiled either way. No `rand`: the reference signer takes its nonce as a parameter because its
# only callers are tests — see the note at the top of src/embed_auth.rs.
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
# The OS CSPRNG, for GENERATING the embed key on first boot (crypto.randomBytes(32) in the TS).
# `getrandom` and not `rand`: it is already in the workspace lock, it is the thin syscall wrapper
# `rand` itself uses for seeding, and key material must come from the OS pool directly — a
# userspace PRNG is a strictly larger thing to trust for a secret written to disk once.
getrandom = "0.3"
# The ONE outbound call this server makes (the OAuth usage + profile endpoints). Blocking and
# rustls-only, which is what makes it cheap here: it is already in the lock at this exact version as
# libduckdb-sys' build dependency, so declaring it adds no new crate, no OpenSSL, and no async
# client stack for a request that fires at most once per 10-minute TTL.
ureq = "3"
tokio ={ version = "1", features = ["rt-multi-thread", "net", "macros", "time", "signal", "sync"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-core = "0.3"
# /api/server-stats resources (src/resourceMonitor.ts): rss, loadavg, statvfs — already in the
# lock via tokio; a direct dep so the calls are ours, not a transitive accident.
libc = "0.2"

[dev-dependencies]
# forensics_scan's oracle stamps fixture mtimes on both sides: a spool EvidenceRow carries no
# ts_ms, so resolve_ts falls back to the file's mtime — and git does not preserve mtimes, so a
# checked-out fixture would otherwise carry whatever time the clone happened. std cannot SET an
# mtime. Already in the lock via notify, so this adds no crate and no compile.
filetime = "0.2"

[[bin]]
name = "alcore"
path = "src/bin/alcore.rs"

[[bin]]
name = "alsummarize"
path = "src/bin/alsummarize.rs"
