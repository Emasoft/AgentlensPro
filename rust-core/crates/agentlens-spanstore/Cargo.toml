[package]
name = "agentlens-spanstore"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Parallel reader for AgentlensPro's segmented span store (NDJSON day segments, sealed days gzipped) — TRDD-DMWOBWFH Phase 1"

[dependencies]
flate2 = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "alscan"
path = "src/bin/alscan.rs"
